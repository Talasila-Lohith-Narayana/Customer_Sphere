name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: customer_sphere_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-root-password
      DB_NAME: customer_sphere_ci
      ANALYTICS_DB_NAME: customer_sphere_ci
      JWT_SECRET_KEY: ci-only-secret-key-not-for-production-use
      ADMIN_PASSWORD: ci-admin-password
      VIEWER_PASSWORD: ci-viewer-password
      ALLOW_BOOTSTRAP_USERS: "false"
      RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: astral-sh/setup-uv@v6
      - run: uv pip sync --system requirements-lock.txt
        working-directory: backend
      - run: pytest -m "not integration"
        env:
          CUSTOMER_INTELLIGENCE_ROOT: ${{ runner.temp }}/customer-intelligence
      - run: alembic upgrade head
      - run: pytest -m integration tests/test_ci_services_integration.py
        env:
          CUSTOMER_INTELLIGENCE_ROOT: ${{ runner.temp }}/customer-intelligence
